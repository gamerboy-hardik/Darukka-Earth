version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: darukaa_db
    environment:
      POSTGRES_USER: darukaa
      POSTGRES_PASSWORD: darukaa_password
      POSTGRES_DB: darukaa_earth
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
